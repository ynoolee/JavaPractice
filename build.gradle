plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.6.21'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(libs.bundles.testing)
    testRuntimeOnly(libs.junit.engine)
    implementation(libs.guava)
}

test {
    useJUnitPlatform()
}

